<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Pendaftaran Workshop</h1>
      <p class="subtitle">Silakan isi formulir di bawah ini.</p>

      <form id="formWorkshop">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" />
        <small id="errorNama"></small>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="contoh@email.com" />
        <small id="errorEmail"></small>

        <label for="sesi">Pilih Sesi Workshop</label>
        <select id="sesi">
          <option value="">-- Pilih Sesi --</option>
          <option value="Sesi Pagi">Sesi Pagi</option>
          <option value="Sesi Siang">Sesi Siang</option>
          <option value="Sesi Sore">Sesi Sore</option>
        </select>
        <small id="errorSesi"></small>

        <p id="pilihanSesi"></p>

        <label for="catatan">Catatan Tambahan</label>
        <textarea
          id="catatan"
          maxlength="200"
          placeholder="Tulis catatan..."
        ></textarea>

        <p id="hitungKarakter">0/200 karakter</p>

        <button type="submit">Daftar Sekarang</button>
        <button type="reset" class="reset">Reset</button>
      </form>

      <div id="hasil"></div>
    </div>
  </body>
</html>
